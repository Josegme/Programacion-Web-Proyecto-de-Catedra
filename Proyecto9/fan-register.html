<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro como Fan | Marvel Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      .register-container {
        max-width: 600px;
        margin: 80px auto;
        padding: 40px;
        background: rgba(20, 20, 20, 0.9);
        border-radius: 15px;
        border: 2px solid #ed1d24;
        box-shadow: 0 20px 60px rgba(237, 29, 36, 0.3);
      }
      .register-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .register-header h1 {
        font-family: "Bebas Neue", cursive;
        font-size: 3rem;
        color: #ed1d24;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .back-link {
        display: inline-block;
        color: #fff;
        text-decoration: none;
        margin-bottom: 20px;
        padding: 10px 20px;
        background: rgba(237, 29, 36, 0.2);
        border-radius: 25px;
        border: 1px solid #ed1d24;
        transition: all 0.3s ease;
      }
      .back-link:hover {
        background: rgba(237, 29, 36, 0.4);
        transform: translateY(-2px);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .form-group {
        margin-bottom: 25px;
      }
      .form-group label {
        display: block;
        color: #fff;
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }
      .form-group input {
        width: 100%;
        padding: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid #ed1d24;
        border-radius: 8px;
        color: #fff;
        font-family: "Roboto Condensed", sans-serif;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .form-group input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        border-color: #fff;
        box-shadow: 0 0 20px rgba(237, 29, 36, 0.5);
      }
      .submit-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #ed1d24, #b71c1c);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-family: "Bebas Neue", cursive;
        font-size: 1.4rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 20px;
      }
      .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(237, 29, 36, 0.5);
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .message {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 700;
      }
      .message.success {
        background: rgba(76, 175, 80, 0.2);
        border: 2px solid #4caf50;
        color: #4caf50;
      }
      .message.error {
        background: rgba(244, 67, 54, 0.2);
        border: 2px solid #f44336;
        color: #f44336;
      }
      @media (max-width: 768px) {
        .form-row {
          grid-template-columns: 1fr;
          gap: 0;
        }
        .register-container {
          margin: 40px 20px;
          padding: 30px 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="register-header">
        <a href="index.html" class="back-link">← Volver</a>
        <h1>Registro como Fan</h1>
      </div>

      <form id="fanRegisterForm">
        <div class="form-row">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input name="nombre" id="nombre" required placeholder="Tu nombre" />
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input name="apellido" id="apellido" placeholder="Tu apellido" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="edad">Edad</label>
            <input
              type="number"
              name="edad"
              id="edad"
              min="0"
              placeholder="Tu edad"
            />
          </div>
          <div class="form-group">
            <label for="documento">Documento</label>
            <input
              name="documento"
              id="documento"
              placeholder="DNI/Pasaporte"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="fechaNacimiento">Fecha de nacimiento</label>
          <input type="date" name="fechaNacimiento" id="fechaNacimiento" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            name="email"
            id="email"
            required
            placeholder="tu@correo.com"
          />
        </div>

        <button type="submit" class="submit-btn">Registrarme como Fan</button>
      </form>

      <div id="fanMsg" role="status" aria-live="polite" class="message"></div>
    </div>

    <script type="module" src="js/registers.js"></script>
    <script>
      // Estilizar mensajes
      const msgElement = document.getElementById("fanMsg");

      // Sobrescribir el comportamiento del mensaje
      const observer = new MutationObserver(() => {
        if (
          msgElement.textContent.includes("recibido") ||
          msgElement.textContent.includes("Gracias")
        ) {
          msgElement.className = "message success";
        } else if (msgElement.textContent.includes("Error")) {
          msgElement.className = "message error";
        }
      });

      observer.observe(msgElement, {
        childList: true,
        characterData: true,
        subtree: true,
      });
    </script>
  </body>
</html>
