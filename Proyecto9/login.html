<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Heroes Database</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="img/logo.png" alt="Marvel Logo" />
        <h1>LOGIN</h1>
      </div>
      <nav>
        <a href="index.html">Inicio</a>
        <a href="heroes.html">Héroes</a>
        <a href="admin.html">Panel Admin</a>
      </nav>
    </header>
    <main class="container">
      <h2>Iniciar sesión</h2>
      <form id="loginForm" class="admin-form">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input
          type="password"
          id="loginPwd"
          placeholder="Contraseña"
          required
        />
        <button type="submit">Login</button>
        <div id="loginMsg"></div>
      </form>
      <h2>Registrarse</h2>
      <form id="registerForm" class="admin-form">
        <input type="email" id="regEmail" placeholder="Email" required />
        <input type="password" id="regPwd" placeholder="Contraseña" required />
        <button type="submit">Registrarse</button>
        <div id="registerMsg"></div>
      </form>
    </main>
    <script type="module">
      import { login, register } from "./js/api.js";
      document.getElementById("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const pwd = document.getElementById("loginPwd").value;
        try {
          const res = await login(email, pwd);
          sessionStorage.setItem("jwt", res.token);
          document.getElementById("loginMsg").textContent = "Login exitoso.";
          window.location.href = "admin.html";
        } catch {
          document.getElementById("loginMsg").textContent =
            "Error al iniciar sesión.";
        }
      };
      document.getElementById("registerForm").onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById("regEmail").value;
        const pwd = document.getElementById("regPwd").value;
        try {
          await register(email, pwd);
          document.getElementById("registerMsg").textContent =
            "Registro exitoso. Ahora puedes iniciar sesión.";
        } catch {
          document.getElementById("registerMsg").textContent =
            "Error al registrarse.";
        }
      };
    </script>
  </body>
</html>
