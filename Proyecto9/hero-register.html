<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Registro de Superheroes | Marvel Database</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <style>
      .register-container {
        max-width: 600px;
        margin: 80px auto;
        padding: 40px;
        background: rgba(20, 20, 20, 0.9);
        border-radius: 15px;
        border: 2px solid #ed1d24;
        box-shadow: 0 20px 60px rgba(237, 29, 36, 0.3);
      }
      .register-header {
        text-align: center;
        margin-bottom: 40px;
      }
      .register-header h1 {
        font-family: "Bebas Neue", cursive;
        font-size: 3rem;
        color: #ed1d24;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
      }
      .back-link {
        display: inline-block;
        color: #fff;
        text-decoration: none;
        margin-bottom: 20px;
        padding: 10px 20px;
        background: rgba(237, 29, 36, 0.2);
        border-radius: 25px;
        border: 1px solid #ed1d24;
        transition: all 0.3s ease;
      }
      .back-link:hover {
        background: rgba(237, 29, 36, 0.4);
        transform: translateY(-2px);
      }
      .form-group {
        margin-bottom: 25px;
      }
      .form-group label {
        display: block;
        color: #fff;
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 1.1rem;
      }
      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 15px;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid #ed1d24;
        border-radius: 8px;
        color: #fff;
        font-family: "Roboto Condensed", sans-serif;
        font-size: 1rem;
        transition: all 0.3s ease;
      }
      .form-group input::placeholder,
      .form-group textarea::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        border-color: #fff;
        box-shadow: 0 0 20px rgba(237, 29, 36, 0.5);
      }
      .form-group textarea {
        min-height: 120px;
        resize: vertical;
      }
      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
        width: 100%;
      }
      .file-input-wrapper input[type="file"] {
        position: absolute;
        left: -9999px;
      }
      .file-input-label {
        display: block;
        padding: 15px;
        background: rgba(237, 29, 36, 0.2);
        border: 2px solid #ed1d24;
        border-radius: 8px;
        color: #fff;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .file-input-label:hover {
        background: rgba(237, 29, 36, 0.4);
      }
      .submit-btn {
        width: 100%;
        padding: 18px;
        background: linear-gradient(135deg, #ed1d24, #b71c1c);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-family: "Bebas Neue", cursive;
        font-size: 1.4rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: 20px;
      }
      .submit-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(237, 29, 36, 0.5);
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      .message {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-family: "Roboto Condensed", sans-serif;
        font-weight: 700;
      }
      .message.success {
        background: rgba(76, 175, 80, 0.2);
        border: 2px solid #4caf50;
        color: #4caf50;
      }
      .message.error {
        background: rgba(244, 67, 54, 0.2);
        border: 2px solid #f44336;
        color: #f44336;
      }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="register-header">
        <a href="index.html" class="back-link">← Volver</a>
        <h1>Registro de Superheroes</h1>
      </div>

      <form id="heroRegisterForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="nombre">Nombre (ej: Tony Stark)</label>
          <input
            name="nombre"
            id="nombre"
            required
            placeholder="Ingresa el nombre real"
          />
        </div>

        <div class="form-group">
          <label for="alterEgo">Alter Ego (ej: Iron Man)</label>
          <input
            name="alterEgo"
            id="alterEgo"
            placeholder="Ingresa el nombre de superhéroe"
          />
        </div>

        <div class="form-group">
          <label for="origen">Cuenta cómo obtuvo su poder</label>
          <textarea
            name="origen"
            id="origen"
            placeholder="Describe el origen de sus poderes..."
          ></textarea>
        </div>

        <div class="form-group">
          <label>Foto (imagen)</label>
          <div class="file-input-wrapper">
            <input type="file" id="heroImage" accept="image/*" />
            <label for="heroImage" class="file-input-label">
              <span id="fileLabel">Seleccionar archivo</span>
            </label>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          Registrarme como Superhero
        </button>
      </form>

      <div id="heroMsg" role="status" aria-live="polite" class="message"></div>
    </div>

    <script type="module" src="js/registers.js"></script>
    <script>
      // Actualizar label del archivo
      document
        .getElementById("heroImage")
        .addEventListener("change", function (e) {
          const fileName = e.target.files[0]?.name || "Seleccionar archivo";
          document.getElementById("fileLabel").textContent = fileName;
        });

      // Estilizar mensajes
      const originalLog = console.log;
      const msgElement = document.getElementById("heroMsg");

      // Sobrescribir el comportamiento del mensaje
      const observer = new MutationObserver(() => {
        if (
          msgElement.textContent.includes("recibido") ||
          msgElement.textContent.includes("Gracias")
        ) {
          msgElement.className = "message success";
        } else if (msgElement.textContent.includes("Error")) {
          msgElement.className = "message error";
        }
      });

      observer.observe(msgElement, {
        childList: true,
        characterData: true,
        subtree: true,
      });
    </script>
  </body>
</html>
